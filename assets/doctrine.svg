<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 612" role="img" aria-labelledby="title desc">
  <title id="title">Operating doctrine</title>
  <desc id="desc">Chain of Command. OPERATOR me: sets intent and the law holds every gate: test · merge · push. LEAD Fable: reads · plans · audits decides · verifies · reports; writes no code. WORKER Opus: writes the code compile-only · owns its files. WORKER Opus: writes the code compile-only · owns its files. Two workers at most. Effort is set per task. Tokens are a budget. The Tight Snowball: 01 Modularity (one error module, one log module no hardcoded values), 02 Prove by Attack (negative tests, boundaries, sabotage a pass must survive it), 03 Aggressive Fuzz (every module, tests included misuse and disaster), 04 Live Tour (the real program, every screen as a hostile user). Fixed order. A stage starts only when the previous one is honestly complete.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    @media (prefers-reduced-motion: no-preference) {
      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pop { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
      .band { animation: rise 0.6s ease-out both; }
      .wire { stroke-dasharray: 1 2; animation: draw 0.6s ease-out both; }
      .head { animation: fade 0.25s ease-out both; }
      .node { transform-box: fill-box; transform-origin: center; animation: pop 0.4s ease-out both; }
      .b0 .wire { animation-delay: 0.3s; }
      .b0 .head { animation-delay: 0.9s; }
      .b0 { animation-delay: 0s; }
      .b1 { animation-delay: 0.35s; }
      .n0 { animation-delay: 0.55s; }
      .n1 { animation-delay: 0.85s; }
      .n2 { animation-delay: 1.15s; }
      .n3 { animation-delay: 1.45s; }
      .s0 .wire { animation-duration: 0.2s; animation-delay: 0.75s; }
      .s0 .head { animation-delay: 0.95s; }
      .s1 .wire { animation-duration: 0.2s; animation-delay: 1.05s; }
      .s1 .head { animation-delay: 1.25s; }
      .s2 .wire { animation-duration: 0.2s; animation-delay: 1.35s; }
      .s2 .head { animation-delay: 1.55s; }
    }
  </style>
