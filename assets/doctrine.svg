      <text x="621" y="259" font-size="14" font-weight="bold" fill="#E6EDF3">Opus</text>
      <text x="621" y="281" font-size="12" fill="#8B949E" text-anchor="start"><tspan x="621" dy="0">writes the code</tspan><tspan x="621" dy="17">compile-only · owns its files</tspan></text>
    </g>
    <text x="24" y="346" font-size="11" fill="#8B949E">Two workers at most. Effort is set per task. Tokens are a budget.</text>
