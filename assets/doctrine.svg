    <text x="128" y="508" font-size="13" font-weight="bold" fill="#E6EDF3" text-anchor="middle">Modularity</text>
    <text x="128" y="528" font-size="12" fill="#8B949E" text-anchor="middle"><tspan x="128" dy="0">one error module,</tspan><tspan x="128" dy="16">one log module</tspan><tspan x="128" dy="16">no hardcoded values</tspan></text>
    <text x="336" y="508" font-size="13" font-weight="bold" fill="#E6EDF3" text-anchor="middle">Prove by Attack</text>
    <text x="336" y="528" font-size="12" fill="#8B949E" text-anchor="middle"><tspan x="336" dy="0">negative tests,</tspan><tspan x="336" dy="16">boundaries, sabotage</tspan><tspan x="336" dy="16">a pass must survive it</tspan></text>
